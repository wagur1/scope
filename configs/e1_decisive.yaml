# E1 decisive experiment config (pre-registered; docs/PROTOCOL.md).
# Copy to a private workdir config, fill in data paths, then:
#   python scripts/run_e1.py <config> && (eval pass) && python scripts/report_e1.py <workdir>

workdir: ./work_e1            # created if missing; holds data/, masks/, enc/, results/
encoder: x265                 # x264 | x265   (VTM/VVenC are E2 arms)
preset: medium
qp_grid: [22, 24, 27, 29, 32, 34, 37, 39, 42]  # CTC + intermediate mid-QPs (narrow-window risk, MATH.md section 6)
roi_deltas: [4, 8, 12, 16]    # A1 background QP offsets (MATH.md section 3); gate uses strongest-delta rule
blur_sigma: 8.0               # A2 training-free editor (pre-registered in MATH.md section 2)

arms:
  A0_anchor: true
  A1_roi: true
  A2_preedit_fb: true
  A3_preedit_scope: false     # enable after integrating miccunifi/SCOPE weights
  A4_preedit_fb_roi: true

sequences:
  - id: mot17_02
    domain: mot
    frames: /path/to/mot17/MOT17-02-FRCNN/img1   # %04d.png naming expected
  - id: mot17_05
    domain: mot
    frames: /path/to/mot17/MOT17-05-FRCNN/img1
  # >= 8 sequences required (hard gate in MATH.md section 6); >= 10 preferred; set domain: mot | coco

# Evaluation pass inputs (fill after encoding):
detector_weights: yolov8n.pt  # frozen scorer, same for every arm (council R2)
gt_json: /path/to/annotations_coco.json   # COCO format, image ids = frame order
